services:
  db:
    image: postgis/postgis:17-3.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: moscow_events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_PASSWORD:-change-me}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moscow_events"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [app]

  backend:
    image: ghcr.io/nelkor/moscow-events:latest
    restart: unless-stopped
    environment:
      PG_HOST: db
      PG_PORT: 5432
      PG_DB_NAME: moscow_events
      PG_USER_NAME: postgres
      PG_USER_PASSWORD: ${PG_PASSWORD:-change-me}
      SEED_MODE: sample
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    networks: [app]

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_started
    networks: [app]

volumes:
  db-data:

networks:
  app: