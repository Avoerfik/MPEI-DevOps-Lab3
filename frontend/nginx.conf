# Явное указание типов для важных файлов
types {
    text/html html;
    text/css css;
    application/javascript js;
}

server {
    listen 80;
    server_name _;

    # Эта строка сообщает Nginx, что файлы .css — это CSS, а .js — это JS
    include /etc/nginx/mime.types;

    root /usr/share/nginx/html;
    index index.html;

    # Статические файлы фронтенда
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксирование REST API в бэкенд
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Служебные маршруты и документация бэкенда
    location ~ ^/(docs|redoc|openapi\.json|health)(/|$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}